<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Random Password Generator</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <section class="password-card">
        <div class="icon">🔐</div>

        <h1>Password Generator</h1>

        <p class="subtitle">Create a strong and secure password instantly.</p>

        <div class="password-area">
          <div class="password-display">
            <span id="result">Generate Password</span>
          </div>

          <button id="copyButton" class="copy-btn">Copy</button>
        </div>

        <button id="button" class="generate-btn">Generate Password</button>

        <p class="info">
          🔒 Your password is generated locally in your browser.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
